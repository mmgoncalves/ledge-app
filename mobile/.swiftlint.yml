# SwiftLint configuration — Ledge

included:
  - Ledge/Sources
  - LedgeTests

excluded:
  - .build
  - DerivedData

disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_first_not_nil
  - discouraged_optional_collection
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_imports
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

line_length:
  warning: 120
  error: 160
  ignores_urls: true

function_body_length:
  warning: 40
  error: 60

type_body_length:
  warning: 200
  error: 300

file_length:
  warning: 300
  error: 400

type_name:
  min_length: 3
  max_length: 50

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - url
    - i
    - x
    - y
